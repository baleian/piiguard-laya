# piiguard-laya 실행 환경 (보통은 make 로 실행한다)
#
#   cpu   : linux/amd64 · linux/arm64 (Apple Silicon 의 Docker 도 여기 — 컨테이너에선 Metal GPU 사용 불가)
#   cuda  : NVIDIA GPU (amd64, arm64/DGX Spark). torch cu130 → RTX 50xx(Blackwell) 포함
#
#   docker compose run --rm cpu  bench --model base/laya-multilingual --limit 200
#   docker compose --profile cuda run --rm cuda bench --model trained/r1
#
# 모델은 ./models (models/base/ = Base 모델, models/trained/ = 학습된 모델) 에 있다. Base 모델이 없으면 처음 쓸 때 Hugging Face 에서 받는다.
# 오프라인 실행: HF_HUB_OFFLINE=1 로 두면 받지 않고 models/ 에 있는 모델만 쓴다 (docs/PLATFORMS.md).

x-common: &common
  user: "${PIIGUARD_LAYA_UID:-1000}:${PIIGUARD_LAYA_GID:-1000}"   # make 가 현재 사용자 id 로 채운다
  working_dir: /workspace
  init: true
  volumes:
    - ./configs:/workspace/configs
    - ./datasets:/workspace/datasets
    - ./training:/workspace/training
    - ./models:/workspace/models
    - ./reports:/workspace/reports
    - ./feedback:/workspace/feedback
  # environment 는 서비스별로 정의 (YAML merge 는 얕게 합쳐져 서비스 쪽이 통째로 덮어쓴다)

services:
  cpu:
    <<: *common
    image: piiguard-laya:cpu
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: {TORCH_INDEX: cpu, TORCH_VERSION: "${TORCH_VERSION:-2.14.0}"}
    environment:
      HOME: /tmp
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      HF_TOKEN: "${HF_TOKEN:-}"
      LAYA_REVISION: "${LAYA_REVISION:-}"        # Base 모델을 처음 받을 때 리비전 고정 (예: e333cb7c823cd1787276228260f56d02fbf5180b)
      PIIGUARD_LAYA_DEVICE: cpu
      PIIGUARD_LAYA_BATCH: "${PIIGUARD_LAYA_BATCH:-16}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-8}"   # 물리 코어 수 이하로

  cuda:
    <<: *common
    profiles: [cuda]
    image: piiguard-laya:cuda
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: {TORCH_INDEX: "${TORCH_INDEX:-cu130}", TORCH_VERSION: "${TORCH_VERSION:-2.14.0}"}
    environment:
      HOME: /tmp
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      HF_TOKEN: "${HF_TOKEN:-}"
      LAYA_REVISION: "${LAYA_REVISION:-}"
      PIIGUARD_LAYA_DEVICE: cuda
      PIIGUARD_LAYA_BATCH: "${PIIGUARD_LAYA_BATCH:-32}"
      LAYA_CUDA_AMP: "${LAYA_CUDA_AMP:-}"        # 빈 값 = 체크포인트 기본(bf16). fp16/fp32 로 바꿔 임계값 영향 비교 가능
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]
