[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "piiguard-laya"
version = "0.1.0"
description = "Laya 결정 모델 기반 PII 가드레일 벤치마크 · 피드백 루프"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    # torch 는 플랫폼별 빌드(cpu / cu130 / mps)가 달라서 여기서 고정하지 않는다.
    # Docker 에서는 docker/Dockerfile 이, 맥 네이티브에서는 scripts/mac_native.sh 가 먼저 설치한다.
    "laya==0.4.34",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
piiguard-laya = "piiguard_laya.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
piiguard_laya = ["site/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
