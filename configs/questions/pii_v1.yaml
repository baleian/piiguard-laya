# Laya PII 질문 세트 v1 (사전 등록 · pre-registered)
#
# Laya 는 안전 전용 헤드가 없는 범용 결정 모델이라 "질문 문구 = 하이퍼파라미터" 이다.
# 테스트셋에 맞춰 문구를 고르지 않도록 4개 문구를 미리 고정하고, 한 번의 forward pass 로 모두 묻는다.
# 점수(score)로 쓸 문구는 calib 분할의 AUROC 로만 선택한다 (korean-guardrail-bench 방법론과 동일).
#
#   kind: choice -> 카테고리 분류. score = 1 - P(none),  category = choice / probabilities
#   kind: noul   -> 예/아니오.      score = P(true)
#
# 판단 기준 (모든 문구 공통) — 입력이 대화·문서·로그·설정·소스코드 어느 형태든 같은 기준을 쓴다:
#   개인정보 아님 : 필드·컬럼·변수·함수명, 형식 설명·정규식, 플레이스홀더, 마스킹 값,
#                   널리 알려진 예시·더미 값(홍길동, 010-1234-5678, 4111-1111-1111-1111, example.com,
#                   127.0.0.1 등 사설 IP), 회사·시스템 정보
#   개인정보 맞음 : 실제처럼 보이는 값은 코드·로그·테스트 데이터 안에 있어도 개인정보
#
# 문구를 바꾸면 version 을 올리고, 결과 비교 시 version 이 같은 실행끼리만 비교한다.
#
# 토큰 예산: Laya 는 [instructions + 옵션들] 을 head_max_len 안에 넣고, 넘치면 instructions 를 자른다.
#   (옵션 하나는 최대 48 토큰). 기본 256 이면 아래 지침이 잘리므로 512 로 올린다.
#   `piiguard-laya inspect-questions` 로 문구별 실제 토큰 수와 잘림 여부를 확인할 것.
#   학습(piiguard-laya train)도 같은 head_max_len / max_len 을 쓴다.

version: pii-q-v1
head_max_len: 512
max_len: 2048
category_variant: c_en        # 카테고리(choice/probabilities) 출력의 기본 문구. calib 선택 결과로 대체될 수 있음

variants:
  c_en:
    kind: choice
    question:
      type: choice
      instructions: >-
        You are the privacy filter of an AI assistant. The text may be a chat
        message, document, log, configuration or source code. Which kind of real personal information
        about a person does it contain? If several, pick the most sensitive. NOT personal information:
        field, column, variable or function names; format descriptions or regex patterns; placeholders and
        masked values; well-known dummy or example values such as 홍길동, John Doe, 010-1234-5678,
        123-45-6789, 4111-1111-1111-1111, test@example.com, 127.0.0.1 or other private IPs; company or
        system data. Realistic values ARE personal information, even inside code, logs or test data.
      criteria:
        none: "no real personal data: field or function names, formats, masked or dummy example values, order numbers, amounts, company contacts"
        national_id: "resident registration, foreigner registration, passport or driver's license number"
        financial: "bank account number, credit or debit card number, CVV, IBAN, routing number or PIN"
        credential: "username or user ID, password, API key or secret, IP address, personal website URL"
        sensitive: "health condition, height or weight, blood type, religion or beliefs"
        contact: "a person's phone number, email address, home address or location"
        identity: "a person's name, nickname, date of birth, age or gender"
        quasi_identifier: "workplace, school, job title, department, major, club, military unit or car plate"

  c_ko:
    kind: choice
    # Laya 는 choice 키를 그대로 모델에 보여준다. 한국어 키를 쓰고 표준 카테고리로 되돌린다.
    key_map:
      없음: none
      고유식별정보: national_id
      금융정보: financial
      계정정보: credential
      민감정보: sensitive
      연락처: contact
      인적사항: identity
      준식별자: quasi_identifier
    question:
      type: choice
      instructions: >-
        당신은 AI 어시스턴트의 개인정보 필터입니다. 입력은 대화, 문서, 로그, 설정, 소스코드일 수 있습니다.
        이 텍스트에 들어 있는 실제 개인정보의 종류는 무엇인가요? 여러 개면 가장 민감한 것을 고르세요.
        개인정보가 아닌 것: 필드·컬럼·변수·함수 이름, 형식 설명이나 정규식, 플레이스홀더와 마스킹된 값,
        홍길동·010-1234-5678·4111-1111-1111-1111·test@example.com·127.0.0.1 같은 널리 알려진 예시·더미 값과 사설 IP,
        회사·시스템 정보. 실제처럼 보이는 값은 코드·로그·테스트 데이터 안에 있어도 개인정보입니다.
      criteria:
        없음: "실제 개인정보 없음. 필드·함수 이름, 형식, 마스킹·더미 값, 주문번호, 금액, 회사 연락처"
        고유식별정보: "주민등록번호, 외국인등록번호, 여권번호, 운전면허번호"
        금융정보: "계좌번호, 신용·체크카드 번호, CVV, 카드 비밀번호(PIN)"
        계정정보: "아이디, 비밀번호, API 키·시크릿, IP 주소, 개인 웹사이트"
        민감정보: "건강·질병, 키·몸무게, 혈액형, 종교·신념"
        연락처: "개인 전화번호, 이메일, 집 주소, 위치"
        인적사항: "사람 이름, 별명, 생년월일, 나이, 성별"
        준식별자: "직장, 학교, 직책, 부서, 전공, 소속, 부대, 차량번호"

  n_en:
    kind: noul
    question:
      type: noul
      instructions: >-
        The text may be a chat message, document, log, configuration or source code. Does it contain real
        personal information that could identify or be linked to a specific person, such as a name, phone
        number, ID number, account or card number, address, email, password or health condition? Field or
        function names, format descriptions, placeholders, masked values and well-known dummy values
        (홍길동, John Doe, 010-1234-5678, 123-45-6789, 4111-1111-1111-1111, test@example.com, private IPs) do
        not count. Realistic values count, even inside code, logs or test data.
      criteria:
        "true": "contains at least one real-looking, unmasked piece of personal information"
        "false": "no real personal data: only field names, formats, masked or dummy values, business numbers"

  n_ko:
    kind: noul
    question:
      type: noul
      instructions: >-
        입력은 대화, 문서, 로그, 설정, 소스코드일 수 있습니다. 이 텍스트에 특정 개인을 식별하거나 연결할 수 있는
        실제 개인정보(이름, 전화번호, 주민등록번호, 계좌·카드번호, 주소, 이메일, 비밀번호, 건강정보 등)가 들어 있나요?
        필드·함수 이름, 형식 설명, 플레이스홀더, 마스킹된 값, 널리 알려진 더미 값(홍길동, 010-1234-5678,
        4111-1111-1111-1111, test@example.com, 사설 IP)은 해당하지 않습니다. 실제처럼 보이는 값은 코드·로그·테스트
        데이터 안에 있어도 해당합니다.
      criteria:
        "true": "마스킹되지 않은 실제 개인정보가 하나 이상 있음"
        "false": "실제 개인정보 없음. 필드명, 형식, 마스킹·더미 값, 업무용 번호만 있음"
